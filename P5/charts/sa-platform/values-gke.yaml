global:
  namespace: sa-p6
  imageRegistry: us-central1-docker.pkg.dev/project-2cbee419-ed7b-469e-89d/sa-p6
  logLevel: info

mysql:
  image:
    registry: docker.io
    repository: bitnamilegacy/mysql
    tag: "8.0.35-debian-11-r0"
  primary:
    persistence:
      enabled: true
      storageClass: standard

rabbitmq:
  image:
    registry: docker.io
    repository: bitnamilegacy/rabbitmq
    tag: "3.12.12-debian-11-r0"
  persistence:
    enabled: true
    storageClass: standard

auth-service:
  replicaCount: 1
  autoscaling:
    minReplicas: 1
  image:
    repository: us-central1-docker.pkg.dev/project-2cbee419-ed7b-469e-89d/sa-p6/auth-service
    tag: "1.0.0"
    pullPolicy: Always

