global:
  namespace: sa-p5
  imageRegistry: ""
  logLevel: info
  # jwtSecret y aesKey se definen en values.secrets.yaml (NO versionado).
  # Ver values.example.yaml para el formato esperado.

namespaceResource:
  create: true

resourceQuota:
  enabled: true
  requestsCpu: "2"
  requestsMemory: 2Gi
  limitsCpu: "4"
  limitsMemory: 4Gi
  pods: "30"

limitRange:
  enabled: true
  defaultCpu: 200m
  defaultMemory: 256Mi
  defaultRequestCpu: 100m
  defaultRequestMemory: 128Mi

cronjobs:
  heartbeatImage: "sa-platform/cronjob-heartbeat:1.0.0"
  resumenImage: "sa-platform/cronjob-resumen:1.0.0"
  dbHost: "sa-platform-mysql"
  dbName: "auth_db"
  rabbitmqHost: "sa-platform-rabbitmq"
  carne: "201901444"

mysql:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/mysql
    tag: "8.0.35-debian-11-r0"
  primary:
    resourcesPreset: "none"     # desactiva el preset para poder definir resources manualmente
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 768Mi

rabbitmq:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/rabbitmq
    tag: "3.12.12-debian-11-r0"
  auth:
    username: sa_platform
  persistence:
    enabled: true
    size: 1Gi
  resourcesPreset: "micro"

# --- Subcharts: cada microservicio hereda defaults aqui, sobreescritos por values-dev/prod ---
auth-service:
  enabled: true
  replicaCount: 2
  image:
    repository: sa-platform/auth-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 8004
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }
  autoscaling:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  env:
    PORT: "8004"
    DB_HOST: "sa-platform-mysql"
    DB_PORT: "3306"
    DB_NAME: "auth_db"
    AUTH_COOKIE_NAME: "token"

materiales-service:
  enabled: true
  replicaCount: 2
  image:
    repository: sa-platform/materiales-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 8001
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }
  autoscaling:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  env:
    PORT: "8001"
    DATABASE_URL: "sqlite:////data/materiales.db"

figuras-service:
  enabled: true
  replicaCount: 2
  image:
    repository: sa-platform/figuras-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 8002
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }
  autoscaling:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  env:
    PORT: "8002"
    DATABASE_PATH: "/data/figuras.db"
    MATERIALES_SERVICE_URL: "http://sa-platform-materiales-service:8001/graphql"
    RABBITMQ_HOST: "sa-platform-rabbitmq"

ordenes-service:
  enabled: true
  replicaCount: 2
  image:
    repository: sa-platform/ordenes-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 8003
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }
  autoscaling:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  env:
    PORT: "8003"
    DATABASE_PATH: "/data/ordenes.db"
    FIGURAS_SERVICE_URL: "http://sa-platform-figuras-service:8002/graphql"
    RABBITMQ_HOST: "sa-platform-rabbitmq"

api-gateway:
  enabled: true
  replicaCount: 2
  image:
    repository: sa-platform/api-gateway
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 8000
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 300m, memory: 256Mi }
  autoscaling:
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  env:
    PORT: "8000"
    AUTH_SERVICE_URL: "http://sa-platform-auth-service:8004"
    MATERIALES_SERVICE_URL: "http://sa-platform-materiales-service:8001"
    FIGURAS_SERVICE_URL: "http://sa-platform-figuras-service:8002"
    ORDENES_SERVICE_URL: "http://sa-platform-ordenes-service:8003"
  ingress:
    enabled: true
    className: nginx
    host: sa-p5.local
